name: sytrak_mobile
description: "SyTrak Gen - scans device QR codes and writes NFC tags for SyTrak Gen stations."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.5.0
  mqtt_client: ^10.14.0
  nfc_manager: ^4.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon (SyTrak pin mark). Source images come from sytrak_gen/tools/make_icon.py.
# Regenerate after changing them:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
